---
- name: Create managed users
  ansible.builtin.user:
    name: '{{ item.name }}'
    shell: /bin/bash
    create_home: true
    state: present
  loop: '{{ managed_users }}'

- name: Configure passwordless sudo
  ansible.builtin.copy:
    dest: '/etc/sudoers.d/{{ item.name }}'
    content: "{{ item.name }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  loop: '{{ managed_users }}'

- name: Configure authorized SSH keys
  ansible.posix.authorized_key:
    user: '{{ item.name }}'
    key: '{{ item.public_key }}'
    state: present
  loop: '{{ managed_users }}'
