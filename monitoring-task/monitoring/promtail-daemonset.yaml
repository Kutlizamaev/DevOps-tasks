apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail

spec:
  selector:
    matchLabels:
      app: promtail

  template:
    metadata:
      labels:
        app: promtail

    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0

          args:
            - "-config.file=/etc/promtail/promtail.yaml"

          volumeMounts:
            - name: config
              mountPath: /etc/promtail

            - name: logs
              mountPath: /var/log/pods
              readOnly: true

            - name: positions
              mountPath: /run/promtail

          resources:
            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              cpu: 150m
              memory: 128Mi

      volumes:
        - name: config
          configMap:
            name: promtail-config

        - name: logs
          hostPath:
            path: /var/log/pods
            type: Directory

        - name: positions
          emptyDir: {}
