apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - containerPort: 3100
              name: http

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: data
              mountPath: /loki

          resources:
            requests:
              cpu: 50m
              memory: 128Mi

            limits:
              cpu: 300m
              memory: 384Mi

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: data
          emptyDir: {}
